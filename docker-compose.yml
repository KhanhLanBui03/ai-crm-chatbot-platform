# Hạ tầng + dịch vụ cho môi trường phát triển.
# Nguồn: kế hoạch phần 4 (kiến trúc), mục 4.3 (Kafka), mục 4.4 (Eureka), mục 4.5 (quan sát).
#
#   docker compose up -d postgres redis kafka rustfs-init   # hạ tầng (kéo theo zookeeper, rustfs)
#   docker compose up -d                             # thêm dịch vụ (cần code, xem README)
#   docker compose --profile observability up -d      # thêm Prometheus + Grafana
#
# LƯU Ý: replication factor = 1, một broker Kafka và một nút ZooKeeper là cấu hình PHÁT TRIỂN.
# Vận hành thật cần tối thiểu 3 broker và ZooKeeper ensemble 3 nút (số lẻ để bầu được
# đa số) — ghi rõ điều này trong báo cáo (mục 4.3).

name: thesis-crm-ai

x-eureka-env: &eureka-env
  EUREKA_URL: http://eureka-server:8761/eureka

services:
  # ─────────────────────────── HẠ TẦNG ───────────────────────────

  postgres:
    # pgvector trong cùng cụm PostgreSQL, không vận hành vector DB riêng (ADR-0007)
    image: pgvector/pgvector:pg16
    container_name: crm-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-thesis_crm}
      POSTGRES_USER: ${DB_MIGRATION_USER:-crm_owner}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:-changeme}
    ports:
      # Cổng máy chủ tham số hóa: nhiều máy đã có PostgreSQL cài sẵn giữ 5432.
      # Đổi bằng POSTGRES_HOST_PORT trong .env — xem .env.example.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_MIGRATION_USER:-crm_owner} -d ${DB_NAME:-thesis_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [crm]

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [crm]

  zookeeper:
    # Kafka chạy ở chế độ ZooKeeper (ADR-0009 — lệch so với kế hoạch mục 4.3, vốn ghi KRaft).
    #
    # LƯU Ý PHIÊN BẢN: ZooKeeper bị đánh dấu lỗi thời từ Kafka 3.5 (KIP-500) và bị XÓA HẲN
    # ở Kafka 4.0. Kafka 3.9 / Confluent 7.9 là dòng cuối còn hỗ trợ. Vì vậy phiên bản image
    # ở đây bị ghim cứng, không nâng lên 4.x được.
    image: confluentinc/cp-zookeeper:7.9.0
    container_name: crm-zookeeper
    hostname: zookeeper
    ports:
      - "${ZOOKEEPER_HOST_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      # Lệnh "srvr" của giao thức four-letter-word: ZooKeeper trả về trạng thái máy chủ.
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [crm]

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: crm-kafka
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"   # dành cho máy chủ (host)
    environment:
      KAFKA_BROKER_ID: 1
      # Bầu chọn controller và lưu metadata do ZooKeeper đảm nhiệm, không phải quorum nội bộ.
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 18000

      # --- HAI LISTENER: cái bẫy kinh điển ở mục 4.3 ---
      # INTERNAL cho các container trong mạng Docker (kafka:9092)
      # EXTERNAL cho máy chủ (localhost:29092)
      # Khai báo thiếu một trong hai thì kết nối được từ trong nhưng không từ ngoài,
      # hoặc ngược lại. Đây là lỗi kết nối khó đoán nhất của dự án.
      #
      # Ở chế độ ZooKeeper KHÔNG có listener CONTROLLER — controller được ZooKeeper bầu.
      # Nhờ vậy tránh được luôn lỗi "advertised.listeners cannot use 0.0.0.0" mà chế độ
      # KRaft gộp broker+controller hay gặp.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Môi trường phát triển: một broker nên mọi thứ = 1 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      # Bật tạo topic tự động ở dev, nhưng vẫn khai báo tường minh bằng
      # scripts/create-topics.sh để tái lập được (mục 4.3)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [crm]

  rustfs:
    # Kho tệp tài liệu gốc (UC018) — object storage nói giao thức S3 (ADR-0022).
    # Dev dùng RustFS; cloud dùng AWS S3. Code không đổi, chỉ đổi S3_ENDPOINT.
    #
    # KHÔNG dùng image minio/minio: MinIO ngừng phát hành image từ 10/2025, repo bị lưu
    # trữ 25/04/2026 — mọi tag đã biến mất khỏi Docker Hub lẫn quay.io. RustFS nói cùng
    # API S3, dùng được với client của MinIO (Apache-2.0). Ghim phiên bản cứng.
    image: rustfs/rustfs:1.0.0
    container_name: crm-rustfs
    environment:
      # Tài khoản gốc — CHỈ cho môi trường dev. Cloud dùng IAM role (IRSA), không có khoá.
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-kb-dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-changeme-dev}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      # 9000 trên máy chủ đã dành cho mcp-server-mock — nên API S3 ra cổng 9010.
      - "${S3_HOST_PORT:-9010}:9000"            # API S3
      - "${S3_CONSOLE_HOST_PORT:-9011}:9001"    # giao diện web để xem tệp đã tải lên
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [crm]

  rustfs-init:
    # Chạy một lần: tạo bucket nếu chưa có. Dùng lại chính image RustFS vì nó có sẵn
    # curl hỗ trợ --aws-sigv4 — không phải kéo thêm image công cụ nào. Chạy lại vô hại
    # (tạo bucket đã tồn tại vẫn trả 200).
    image: rustfs/rustfs:1.0.0
    container_name: crm-rustfs-init
    entrypoint: ["sh", "-c"]
    command:
      - >-
        curl -fsS --aws-sigv4 "aws:amz:$$S3_REGION:s3"
        --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY"
        -X PUT "http://rustfs:9000/$$S3_BUCKET"
        && echo "bucket $$S3_BUCKET sẵn sàng"
    environment:
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-kb-tai-lieu}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kb-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-changeme-dev}
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    networks: [crm]

  # ─────────────────────────── TRACK A ───────────────────────────

  eureka-server:
    build: ./eureka-server
    container_name: crm-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [crm]

  gateway:
    build: ./gateway
    container_name: crm-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *eureka-env
      REDIS_HOST: redis
      JWK_SET_URI: http://java-core:8081/.well-known/jwks.json
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [crm]

  java-core:
    build: ./java-core
    container_name: crm-java-core
    ports:
      - "8081:8081"
    environment:
      <<: *eureka-env
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-thesis_crm}
      # ADR-0001: runtime dùng tài khoản KHÔNG phải chủ bảng — chủ bảng bypass RLS
      DB_USERNAME: ${DB_USERNAME:-crm_app}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-crm_owner}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-changeme}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
      # Kho tệp S3 (ADR-0022). java-core GHI tệp gốc của UC018, ai-service đọc.
      S3_ENDPOINT: rustfs:9000
      S3_SECURE: "false"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-kb-tai-lieu}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kb-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-changeme-dev}
      # Dự phòng khi ai-service chưa tự đăng ký Eureka — LoadBalancer hỏi Eureka trước.
      AI_SERVICE_URL: http://ai-service:8000
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [crm]

  web-dashboard:
    build: ./web-dashboard
    container_name: crm-web-dashboard
    ports:
      - "5173:5173"
    environment:
      VITE_GATEWAY_URL: http://gateway:8080
      VITE_WS_URL: ws://gateway:8080/ws
      VITE_USE_MOCK: "false"
    volumes:
      - ./web-dashboard:/app
      - /app/node_modules
    depends_on:
      - gateway
    networks: [crm]

  web-widget:
    build: ./web-widget
    container_name: crm-web-widget
    ports:
      - "5174:5174"
    depends_on:
      - gateway
    networks: [crm]

  # ─────────────────────────── TRACK B ───────────────────────────

  ai-service:
    build: ./ai-service
    container_name: crm-ai-service
    ports:
      - "8000:8000"
    environment:
      <<: *eureka-env
      # Một image, hai vai trò (§3.9.1). Đây là bản API; muốn chạy consumer Kafka thì
      # thêm một service nữa dùng CÙNG image với RUN_MODE=worker.
      RUN_MODE: api
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-thesis_crm}
      DB_USERNAME: ${AI_DB_USERNAME:-ai_app}
      DB_PASSWORD: ${AI_DB_PASSWORD:-changeme}
      KAFKA_BOOTSTRAP: kafka:9092
      # Tầng suy luận chạy ở môi trường (C), NGOÀI compose này (§3.6.2).
      # AI_MODE=mock để stack local chạy được khi chưa bật (C) — §3.4.1.
      AI_MODE: ${AI_MODE:-mock}
      EMBED_URL: ${EMBED_URL:-}
      RERANK_URL: ${RERANK_URL:-}
      CLASSIFY_URL: ${CLASSIFY_URL:-}
      # ADR-0002: bề mặt DUY NHẤT để chạm dữ liệu nghiệp vụ
      JAVA_CORE_URL: http://java-core:8081
      # mcp-server-mock ở REPOSITORY RIÊNG, chạy ngoài compose này (ADR-0005)
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://host.docker.internal:9000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_TEMPERATURE: "0"
      # Kho tệp S3 (ADR-0022). ai-service chỉ ĐỌC tệp java-core đã ghi.
      S3_ENDPOINT: rustfs:9000
      S3_SECURE: "false"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-kb-tai-lieu}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kb-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-changeme-dev}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [crm]

  # Cùng image với ai-service, vai trò consumer Kafka (§3.9.1) — UC019 nạp tài liệu (ADR-0024).
  # Không cổng, không Eureka: không ai gọi vào nó, nó chỉ đọc crm.kb.document.uploaded.
  # Scale bằng replica (cùng group ingestion-cg, Kafka chia partition), KHÔNG tăng tiến trình.
  ai-worker:
    build: ./ai-service
    container_name: crm-ai-worker
    environment:
      RUN_MODE: worker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-thesis_crm}
      DB_USERNAME: ${AI_DB_USERNAME:-ai_app}
      DB_PASSWORD: ${AI_DB_PASSWORD:-changeme}
      # Trong mạng Docker: kafka:9092 (KHÔNG phải localhost:29092 — bẫy hai listener).
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_CONSUMER_GROUP: ingestion-cg
      AI_MODE: ${AI_MODE:-mock}
      EMBED_URL: ${EMBED_URL:-http://host.docker.internal:8081}
      S3_ENDPOINT: rustfs:9000
      S3_SECURE: "false"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-kb-tai-lieu}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kb-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-changeme-dev}
    # Luật 4 của worker: SIGTERM → nạp nốt tài liệu đang dở rồi mới thoát. Mặc định 10 s là giết
    # cứng giữa chừng; 60 s khớp terminationGracePeriodSeconds của §3.10.6.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    networks: [crm]

  # ────────────────── QUAN SÁT (profile riêng) ──────────────────
  # Tách sau profile để `docker compose up` mặc định không nặng thêm.
  # Ba bảng điều khiển là đủ: sức khỏe hệ thống, đường ống AI, chỉ số nghiệp vụ (mục 4.5).

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: crm-prometheus
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [crm]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: crm-grafana
    profiles: [observability]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [crm]

networks:
  crm:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  rustfs_data:
  prometheus_data:
  grafana_data:
