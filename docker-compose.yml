# Hạ tầng + dịch vụ cho môi trường phát triển.
# Nguồn: kế hoạch phần 4 (kiến trúc), mục 4.3 (Kafka), mục 4.4 (Eureka), mục 4.5 (quan sát).
#
#   docker compose up -d postgres redis kafka        # chỉ hạ tầng — chạy được ngay
#   docker compose up -d                             # thêm dịch vụ (cần code, xem README)
#   docker compose --profile observability up -d      # thêm Prometheus + Grafana
#
# LƯU Ý: replication factor = 1 và một broker Kafka là cấu hình PHÁT TRIỂN.
# Vận hành thật cần tối thiểu 3 broker — ghi rõ điều này trong báo cáo (mục 4.3).

name: thesis-crm-ai

x-eureka-env: &eureka-env
  EUREKA_URL: http://eureka-server:8761/eureka

services:
  # ─────────────────────────── HẠ TẦNG ───────────────────────────

  postgres:
    # pgvector trong cùng cụm PostgreSQL, không vận hành vector DB riêng (ADR-0007)
    image: pgvector/pgvector:pg16
    container_name: crm-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-thesis_crm}
      POSTGRES_USER: ${DB_MIGRATION_USER:-crm_owner}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:-changeme}
    ports:
      # Cổng máy chủ tham số hóa: nhiều máy đã có PostgreSQL cài sẵn giữ 5432.
      # Đổi bằng POSTGRES_HOST_PORT trong .env — xem .env.example.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_MIGRATION_USER:-crm_owner} -d ${DB_NAME:-thesis_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [crm]

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [crm]

  kafka:
    # Chế độ KRaft — không cần ZooKeeper (mục 4.3)
    image: apache/kafka:3.9.0
    container_name: crm-kafka
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"   # dành cho máy chủ (host)
    environment:
      # --- KRaft: một tiến trình vừa là broker vừa là controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Một nút duy nhất: quorum trỏ về chính nó qua localhost.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # --- HAI LISTENER: cái bẫy kinh điển ở mục 4.3 ---
      # INTERNAL cho các container trong mạng Docker (kafka:9092)
      # EXTERNAL cho máy chủ (localhost:29092)
      # Khai báo thiếu một trong hai thì kết nối được từ trong nhưng không từ ngoài,
      # hoặc ngược lại.
      #
      # Host để RỖNG (`://:9092`) chứ KHÔNG ghi `0.0.0.0`: Kafka 3.9 suy ra địa chỉ
      # quảng bá của listener CONTROLLER từ `listeners`, và từ chối khởi động với
      # "advertised.listeners cannot use the nonroutable meta-address 0.0.0.0".
      # Host rỗng vẫn lắng nghe trên mọi giao diện nhưng quảng bá bằng hostname.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # --- Môi trường phát triển: một broker nên mọi thứ = 1 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      # Bật tạo topic tự động ở dev, nhưng vẫn khai báo tường minh bằng
      # scripts/create-topics.sh để tái lập được (mục 4.3)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [crm]

  # ─────────────────────────── TRACK A ───────────────────────────

  eureka-server:
    build: ./eureka-server
    container_name: crm-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [crm]

  gateway:
    build: ./gateway
    container_name: crm-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *eureka-env
      REDIS_HOST: redis
      JWK_SET_URI: http://java-core:8081/.well-known/jwks.json
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [crm]

  java-core:
    build: ./java-core
    container_name: crm-java-core
    ports:
      - "8081:8081"
    environment:
      <<: *eureka-env
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-thesis_crm}
      # ADR-0001: runtime dùng tài khoản KHÔNG phải chủ bảng — chủ bảng bypass RLS
      DB_USERNAME: ${DB_USERNAME:-crm_app}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-crm_owner}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-changeme}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [crm]

  web-dashboard:
    build: ./web-dashboard
    container_name: crm-web-dashboard
    ports:
      - "5173:5173"
    environment:
      VITE_GATEWAY_URL: http://localhost:8080
      VITE_WS_URL: ws://localhost:8080/ws
    depends_on:
      - gateway
    networks: [crm]

  web-widget:
    build: ./web-widget
    container_name: crm-web-widget
    ports:
      - "5174:5174"
    depends_on:
      - gateway
    networks: [crm]

  # ─────────────────────────── TRACK B ───────────────────────────

  ai-service:
    build: ./ai-service
    container_name: crm-ai-service
    ports:
      - "8000:8000"
    environment:
      <<: *eureka-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-thesis_crm}
      DB_USERNAME: ${AI_DB_USERNAME:-ai_app}
      DB_PASSWORD: ${AI_DB_PASSWORD:-changeme}
      KAFKA_BOOTSTRAP: kafka:9092
      # ADR-0002: bề mặt DUY NHẤT để chạm dữ liệu nghiệp vụ
      JAVA_CORE_URL: http://java-core:8081
      # mcp-server-mock ở REPOSITORY RIÊNG, chạy ngoài compose này (ADR-0005)
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://host.docker.internal:9000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_TEMPERATURE: "0"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [crm]

  # ────────────────── QUAN SÁT (profile riêng) ──────────────────
  # Tách sau profile để `docker compose up` mặc định không nặng thêm.
  # Ba bảng điều khiển là đủ: sức khỏe hệ thống, đường ống AI, chỉ số nghiệp vụ (mục 4.5).

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: crm-prometheus
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [crm]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: crm-grafana
    profiles: [observability]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [crm]

networks:
  crm:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
