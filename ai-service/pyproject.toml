[project]
name = "ai-service"
version = "0.1.0"
description = "Khối AI: RAG, LangGraph, MCP, chấm điểm Lead, phân nhóm chủ đề, khung đánh giá. Track B."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# app/  = mã phục vụ request
# eval/ = harness thí nghiệm, import ngược vào app.* nhưng KHÔNG thuộc ứng dụng
[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
