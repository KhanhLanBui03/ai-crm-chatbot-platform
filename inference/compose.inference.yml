# inference/compose.inference.yml — chạy trên môi trường (C) Ephemeral Cloud CPU.
# Master Plan §3.6.2.
#
#     docker compose -f inference/compose.inference.yml up -d
#
# BA CỔNG (§3.9.3 — ma trận địa chỉ kết nối, "nguồn lỗi số một"):
#     ai-embed     8091   (không phải 8081: java-core profile `local` chạy trên máy chiếm 8081)
#     ai-rerank    8082
#     ai-classify  8083
#
# ⚠️ CẤU HÌNH TÀI NGUYÊN Ở ĐÂY PHẢI KHỚP ĐÚNG POD TƯƠNG ỨNG TRÊN EKS.
#    Không khớp thì benchmark Tuần 3 không dự báo được gì cho Tuần 7 — đó là toàn bộ
#    lý do tồn tại của môi trường (C).
#
# ⚠️ cpus và OMP_NUM_THREADS phải BẰNG NHAU. Lệch thì /ready trả 503 (bất biến 3, §3.4.2).
#
# Cấp vCPU chốt Ngày 15 bằng bảng benchmark (ADR-0034, docs/report/benchmark-ngay15-2026-10-11.md):
#     ai-embed 4 · ai-rerank 4 (11/10) · ai-classify 1 (17/10, ADR-0034 mục "Cập nhật 17/10").
# Số đo trên máy dev Apple M1 (ARM). Lên cloud x86 thì đo lại (N20) trước khi coi là số production.

name: ai-inference

x-inference-common: &inference-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ai-inference:dev
  restart: unless-stopped
  environment: &inference-env
    MODEL_S3_BUCKET: ${MODEL_S3_BUCKET:-}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  ai-embed:
    <<: *inference-common
    container_name: ai-embed
    ports:
      - "8091:8080"
    environment:
      <<: *inference-env
      MODEL_ROLE: embed
      OMP_NUM_THREADS: "4"        # PHẢI bằng cpus bên dưới — giữ 4: nhúng đoạn nhanh hơn ~30% (ADR-0034)
    # bge-m3-int8.onnx (+ .onnx.data, 541 MB) và tokenizer.json ở artifacts/models/ — mount, không
    # COPY vào image. Thiếu file thì /ready = 503 (embed.check_invariants), không trả vector giả.
    volumes:
      - ../artifacts:/app/artifacts:ro
    deploy:
      resources:
        limits: { cpus: "4", memory: 8G }
        reservations: { cpus: "4", memory: 8G }   # requests == limits → QoS Guaranteed
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 18                 # cho phép ~180s tải model từ S3

  ai-rerank:
    <<: *inference-common
    container_name: ai-rerank
    ports:
      - "8082:8080"
    environment:
      <<: *inference-env
      MODEL_ROLE: rerank
      OMP_NUM_THREADS: "4"        # PHẢI bằng cpus bên dưới — 4 vCPU: p50 −25–30% so với 2 (ADR-0034)
    # bge-reranker-v2-m3-int8.onnx (+ .onnx.data) và bge-reranker-v2-m3-tokenizer.json ở
    # artifacts/models/ — sinh ở notebooks/07, mount, không COPY vào image. Thiếu file thì
    # /ready = 503 (rerank.check_invariants), KHÔNG lùi về điểm Jaccard giả (Ngày 15).
    volumes:
      - ../artifacts:/app/artifacts:ro
    deploy:
      resources:
        limits: { cpus: "4", memory: 4G }
        reservations: { cpus: "4", memory: 4G }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 18

  ai-classify:
    <<: *inference-common
    container_name: ai-classify
    ports:
      - "8083:8080"
    environment:
      <<: *inference-env
      MODEL_ROLE: classify
      OMP_NUM_THREADS: "1"        # PHẢI bằng cpus bên dưới — 1 vCPU: p95 như 2 và 4, lõi thứ hai không được dùng (ADR-0034)
    # Môi trường (C): mount artifact thay vì COPY vào image — giữ image nhỏ và giống bản
    # production (lấy từ S3). Thiếu router_model.onnx / router_embedder.json thì /ready = 503.
    volumes:
      - ../artifacts:/app/artifacts:ro
    deploy:
      resources:
        limits: { cpus: "1", memory: 4G }
        reservations: { cpus: "1", memory: 4G }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
