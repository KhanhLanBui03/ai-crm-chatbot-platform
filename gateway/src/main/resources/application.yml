server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false   # định tuyến tường minh, không tự sinh từ Eureka
      # UC009/UC010 — widget chạy trên website DOANH NGHIỆP (tên miền bất kỳ) gọi API qua gateway.
      # Gateway tự trả lời preflight OPTIONS; không khai CORS thì nó TỪ CHỐI (403) và trình duyệt
      # không bao giờ gửi request thật. Mở "*" chỉ cho đường widget — không phải lỗ hổng: danh sách
      # tên miền được phép kiểm ở java-core cho từng widget (WidgetOriginPolicy), không dùng cookie.
      globalcors:
        cors-configurations:
          '[/api/v1/widget/**]':
            allowedOriginPatterns: "*"
            allowedMethods: [GET, POST, OPTIONS]
            allowedHeaders: [Content-Type, X-Widget-Token, X-Trace-Id]
            allowCredentials: false
            maxAge: 3600
      routes:
        # Định tuyến qua lb:// — Eureka phân giải, không hardcode host:port (ADR-0004)
        - id: java-core
          uri: lb://java-core
          predicates:
            - Path=/api/v1/**
          filters:
            # java-core cũng gắn header CORS cho đường widget (để chạy được khi gọi thẳng lúc dev) →
            # qua gateway thành HAI Access-Control-Allow-Origin, trình duyệt từ chối. Gộp về một.
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/ai/v1/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10

  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT RS256 — java-core phát hành, gateway chỉ xác thực bằng khóa công khai
          jwk-set-uri: ${JWK_SET_URI:http://java-core:8081/.well-known/jwks.json}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka}
    # Kế hoạch mục 4.4: giảm thời gian hội tụ ở môi trường phát triển
    registry-fetch-interval-seconds: 10
  instance:
    # BẮT BUỘC trong Docker: mặc định Eureka đăng ký bằng hostname container,
    # gateway thường không phân giải được (kế hoạch mục 4.4)
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.springframework.cloud.gateway: INFO
