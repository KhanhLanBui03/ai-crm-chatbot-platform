# Hồ sơ dev — ghi đè application.yml khi SPRING_PROFILES_ACTIVE=dev
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.thesis.crm: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO

management:
  endpoint:
    health:
      show-details: always
