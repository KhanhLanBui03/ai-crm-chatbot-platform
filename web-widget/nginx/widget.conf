# [PRODUCTION] Hai server trong một container nhỏ — tách CỔNG để giống thực tế: website doanh nghiệp
# (một tên miền) tải widget từ máy chủ của nền tảng (tên miền khác).

# ── Vai 1: máy chủ phục vụ widget.js ─────────────────────────────────────────
server {
    listen 5174;
    server_name _;
    root /usr/share/nginx/widget;

    location = /widget.js {
        # Tên file không gắn mã phiên bản (mã nhúng của doanh nghiệp cố định) → đệm NGẮN, kèm ETag
        # để bản mới tới khách trong vài phút mà không phải đổi mã nhúng.
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        types { application/javascript js; }
        try_files /widget.js =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Ngoài widget.js không phục vụ gì — không để lộ cấu trúc thư mục
    location / {
        return 404;
    }
}

# ── Vai 2: trang "Cửa hàng Demo" giả làm website của doanh nghiệp ────────────
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/demo;
    index index.html;

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
