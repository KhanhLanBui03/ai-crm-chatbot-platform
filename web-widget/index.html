<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cửa hàng Demo — trang thử widget</title>
    <!-- [R&D] Trang giả website doanh nghiệp, CHỈ dùng khi phát triển và quay video demo UC009/UC010.
         Thực tế doanh nghiệp dán thẻ <script src=".../widget.js" data-widget-key="..."> vào site của họ.
         Mở: http://localhost:5174/?key=<widget_key>&api=<địa chỉ gateway, mặc định http://localhost:8080> -->
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #1f2937; background: #fafaf9; }
      header { background: #1f2937; color: #fff; padding: 18px 32px; display: flex; justify-content: space-between; }
      header b { font-size: 20px; }
      main { max-width: 960px; margin: 32px auto; padding: 0 24px; }
      .luoi { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
      .sp { background: #fff; border: 1px solid #e7e5e4; border-radius: 12px; padding: 16px; }
      .sp .gia { color: #b45309; font-weight: 600; margin-top: 8px; }
      .ghi-chu { margin-top: 32px; font-size: 13px; color: #78716c; }
    </style>
  </head>
  <body>
    <header><b>Cửa hàng Demo</b><span>Hotline 1900 0000</span></header>
    <main>
      <h1>Gói dịch vụ phần mềm bán hàng</h1>
      <div class="luoi">
        <div class="sp"><b>Gói Khởi đầu</b><div>5 người dùng, 2 kênh</div><div class="gia">490.000đ / tháng</div></div>
        <div class="sp"><b>Gói Tăng trưởng</b><div>15 người dùng, 3 kênh</div><div class="gia">1.490.000đ / tháng</div></div>
        <div class="sp"><b>Gói Chuyên nghiệp</b><div>50 người dùng, ưu tiên hỗ trợ</div><div class="gia">3.990.000đ / tháng</div></div>
      </div>
      <p class="ghi-chu" id="ghi-chu">Bấm bong bóng chat ở góc dưới để hỏi trợ lý AI.</p>
    </main>
    <script>
      // Nhúng widget giống hệt cách doanh nghiệp nhúng — chỉ khác là lấy khoá từ địa chỉ trang
      const q = new URLSearchParams(location.search)
      const key = q.get('key')
      if (!key) {
        document.getElementById('ghi-chu').textContent =
          'Thiếu ?key=<widget_key> trên địa chỉ trang — lấy khoá ở mục Cấu hình widget của dashboard.'
      } else {
        const s = document.createElement('script')
        s.type = 'module'
        s.src = '/src/main.ts'
        s.dataset.widgetKey = key
        s.dataset.apiUrl = q.get('api') || 'http://localhost:8080'
        document.body.appendChild(s)
      }
    </script>
  </body>
</html>
